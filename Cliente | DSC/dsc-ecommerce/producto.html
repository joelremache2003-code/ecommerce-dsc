<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="metaTitle">Producto — Deutsche Cycling Spot</title>
<meta name="description" id="metaDesc" content="Producto de ciclismo premium en Deutsche Cycling Spot.">
<meta property="og:title" id="ogTitle" content="Deutsche Cycling Spot">
<meta property="og:description" id="ogDesc" content="">
<meta property="og:image" id="ogImg" content="">
<meta property="og:type" content="product">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/animations.css">
<style>
.page-pad{padding-top:6rem}
.breadcrumb{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--t2);margin-bottom:2rem;flex-wrap:wrap}
.breadcrumb a{color:var(--t2);transition:color var(--transition)}.breadcrumb a:hover{color:var(--t1)}
.breadcrumb-sep{color:var(--t3)}
.product-layout{display:grid;grid-template-columns:1fr 1fr;gap:3.5rem;align-items:start}
/* Image gallery */
.gallery{display:flex;flex-direction:column;gap:.75rem}
.gallery-main{aspect-ratio:1;background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.gallery-main img{width:100%;height:100%;object-fit:cover}
.gallery-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:.75rem;font-size:4rem;opacity:.3}
.gallery-thumbs{display:flex;gap:.6rem;flex-wrap:wrap}
.thumb{width:68px;height:68px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:border-color var(--transition);flex-shrink:0}
.thumb:hover,.thumb.active{border-color:var(--accent)}
.thumb img{width:100%;height:100%;object-fit:cover}
/* Product info */
.product-info{position:sticky;top:6rem}
.product-info-brand{font-size:.72rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
.product-info-name{font-family:'Bebas Neue',var(--font-display);font-size:clamp(2rem,4vw,3rem);font-weight:400;line-height:1.05;letter-spacing:.02em;text-transform:uppercase;margin-bottom:1rem}
.product-info-price{font-size:2.4rem;font-weight:700;font-family:var(--font-display);margin-bottom:1.5rem}
.product-info-price sub{font-size:1rem;font-weight:500;color:var(--t2);vertical-align:middle}
.stock-indicator{display:flex;align-items:center;gap:.5rem;margin-bottom:1.5rem}
.stock-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.stock-dot.in{background:#25D366}.stock-dot.low{background:#F39C12}.stock-dot.out{background:var(--red)}
.stock-text{font-size:.85rem;font-weight:500}
.qty-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem}
.qty-label{font-size:.83rem;color:var(--t2);font-weight:500}
.qty-control{display:flex;align-items:center;gap:.5rem;background:var(--card);border:1px solid var(--border);border-radius:var(--r-full);padding:.2rem .2rem}
.qty-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;transition:background var(--transition);color:var(--t1)}
.qty-btn:hover{background:var(--card-hover)}
.qty-num{min-width:2rem;text-align:center;font-weight:700;font-size:.95rem}
.action-stack{display:flex;flex-direction:column;gap:.75rem;margin-bottom:1.75rem}
.divider-thin{height:1px;background:var(--border);margin:1.5rem 0}
.feature-list{list-style:none;display:flex;flex-direction:column;gap:.6rem}
.feature-list li{display:flex;align-items:center;gap:.65rem;font-size:.88rem;color:var(--t2)}
.feature-list li::before{content:'✓';color:var(--accent);font-weight:700;flex-shrink:0}
.desc-text{color:var(--t2);line-height:1.75;font-size:.93rem}
.related-section{margin-top:5rem;padding-top:3rem;border-top:1px solid var(--border)}
@media(max-width:768px){
  .product-layout{grid-template-columns:1fr;gap:2rem}
  .product-info{position:static}
  .page-pad{padding-top:5rem}
}
</style>
</head>
<body>

<nav class="navbar scrolled" id="navbar" style="background:rgba(7,7,15,0.98);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)">
  <div class="container navbar-inner">
    <a href="index.html" class="nav-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span>DSC</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="catalogo.html">Catálogo</a></li>
      <li><a href="catalogo.html?cat=Nutrici%C3%B3n">Nutrición</a></li>
      <li><a href="catalogo.html?cat=Electr%C3%B3nica">Electrónica</a></li>
      <li><a href="catalogo.html?cat=Llantas">Llantas</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn btn-wa btn-sm" onclick="openWhatsAppGeneral()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        Asesoría
      </button>
      <a href="checkout.html" class="cart-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-count" style="display:none">0</span>
      </a>
      <div class="nav-burger" id="navBurger"><span></span><span></span><span></span></div>
    </div>
  </div>
</nav>

<div class="page-pad">
  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">Inicio</a>
      <span class="breadcrumb-sep">/</span>
      <a href="catalogo.html">Catálogo</a>
      <span class="breadcrumb-sep">/</span>
      <span id="breadcrumbName">Producto</span>
    </div>

    <div class="product-layout" id="productLayout">
      <div style="text-align:center;color:var(--t2);padding:4rem 0;grid-column:1/-1">Cargando...</div>
    </div>

    <div class="related-section reveal">
      <span class="label">También te puede interesar</span>
      <h2 class="section-title" style="margin-bottom:1.5rem">Productos relacionados</h2>
      <div class="grid g4" id="relatedGrid"></div>
    </div>
  </div>
</div>

<footer style="background:var(--surface);border-top:1px solid var(--border);padding:2rem 0;margin-top:5rem">
  <div class="container" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem">
    <a href="index.html" class="nav-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent)"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span style="color:var(--accent)">DSC</span>
    </a>
    <div style="display:flex;gap:1rem;align-items:center">
      <button class="btn btn-wa btn-sm" onclick="openWhatsAppGeneral()">Asesoría WhatsApp</button>
      <a href="privacidad.html" style="color:var(--t3);font-size:.82rem">Privacidad</a>
    </div>
  </div>
</footer>

<div id="toast" class="toast toast-accent"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script src="js/whatsapp.js"></script>
<script>
const productId = new URLSearchParams(location.search).get('id');
const product = getProductById(productId);
let currentQty = 1;

if (!product) {
  document.getElementById('productLayout').innerHTML = `
    <div style="text-align:center;padding:5rem 0;grid-column:1/-1">
      <div style="font-size:3rem;margin-bottom:1rem">😕</div>
      <p style="color:var(--t2);margin-bottom:1.5rem">Producto no encontrado</p>
      <a href="catalogo.html" class="btn btn-primary">Ver catálogo</a>
    </div>`;
} else {
  // Update meta
  document.getElementById('metaTitle').textContent = `${product.name} — Deutsche Cycling Spot`;
  document.getElementById('metaDesc').content = product.description;
  document.getElementById('ogTitle').content = `${product.name} | $${product.price} — DSC`;
  document.getElementById('ogDesc').content = product.description;
  if (product.img) document.getElementById('ogImg').content = product.img;
  document.getElementById('breadcrumbName').textContent = product.name.split(' ').slice(0,5).join(' ') + (product.name.split(' ').length > 5 ? '...' : '');

  const bc = getBrandColor(product.brand);
  const icon = CATEGORY_ICONS[product.category] || '🚴';
  const outOfStock = product.stock === 0;
  const stockClass = product.stock === 0 ? 'out' : product.stock <= 2 ? 'low' : 'in';
  const stockText = product.stock === 0 ? 'Agotado' : product.stock <= 2 ? `Últimas ${product.stock} unidades` : `En stock (${product.stock})`;

  // Build gallery images list
  const imgList = product.img ? [product.img] : [];

  const galleryHtml = `
    <div class="gallery-main" id="galleryMain">
      ${product.img
        ? `<img id="mainImg" src="${product.img}" alt="${product.name}">`
        : `<div class="gallery-placeholder" style="width:100%;height:100%;background:linear-gradient(135deg,${bc.from},${bc.to})">
             <span>${icon}</span>
             <span style="font-family:var(--font-display);font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase">${product.brand}</span>
           </div>`
      }
    </div>
    ${imgList.length ? `<div class="gallery-thumbs" id="thumbs"><div class="thumb active"><img src="${product.img}" alt=""></div></div>` : ''}`;

  const featuresHtml = product.features.map(f => `<li>${f}</li>`).join('');

  document.getElementById('productLayout').innerHTML = `
    <div class="gallery animate-fadeUp">${galleryHtml}</div>
    <div class="product-info animate-fadeUp animate-delay-2">
      <div class="product-info-brand">${product.brand} · ${product.category}</div>
      <h1 class="product-info-name">${product.name}</h1>
      <div class="product-info-price"><sub>USD </sub>${formatPrice(product.price)}</div>
      <div class="stock-indicator">
        <div class="stock-dot ${stockClass}"></div>
        <span class="stock-text" style="color:${product.stock===0?'var(--red)':product.stock<=2?'#F39C12':'#25D366'}">${stockText}</span>
      </div>
      ${!outOfStock ? `
      <div class="qty-wrap">
        <span class="qty-label">Cantidad:</span>
        <div class="qty-control">
          <button class="qty-btn" onclick="changeQty(-1)">−</button>
          <span class="qty-num" id="qtyDisplay">1</span>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
      </div>` : ''}
      <div class="action-stack">
        ${!outOfStock
          ? `<button class="btn btn-primary btn-lg btn-block" onclick="handleAddToCart()">🛒 Agregar al carrito</button>`
          : `<button class="btn btn-ghost btn-lg btn-block" disabled style="opacity:.5;cursor:not-allowed">Agotado</button>`
        }
        <button class="btn btn-wa btn-lg btn-block" onclick="openWhatsAppProduct('${product.id}', currentQty)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
          Comprar por WhatsApp
        </button>
      </div>
      <div class="divider-thin"></div>
      <p class="desc-text">${product.description}</p>
      <div class="divider-thin"></div>
      <ul class="feature-list">${featuresHtml}</ul>
    </div>`;

  // Related products (same category, exclude current)
  const related = PRODUCTS.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);
  if (related.length) {
    document.getElementById('relatedGrid').innerHTML = related.map(p => renderProductCard(p, true)).join('');
  } else {
    document.querySelector('.related-section').style.display = 'none';
  }
  initReveal();
}

function changeQty(delta) {
  if (!product) return;
  currentQty = Math.max(1, Math.min(currentQty + delta, product.stock));
  const el = document.getElementById('qtyDisplay');
  if (el) el.textContent = currentQty;
}

function handleAddToCart() {
  if (!product) return;
  addToCart(product.id, currentQty);
}
</script>
</body>
</html>
