<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo — Deutsche Cycling Spot</title>
<meta name="description" content="Catálogo completo de productos de ciclismo premium. GPS, llantas, nutrición y más.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/animations.css">
<style>
.page-header {
  padding: 8rem 0 3.5rem;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
}
.page-header-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--surface) 0%, var(--bg) 100%);
  z-index: 0;
}
.page-header-orb {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200,255,0,0.06), transparent 70%);
  top: -100px;
  right: -50px;
  pointer-events: none;
}
.page-header > .container { position: relative; z-index: 1; }
.page-header h1 {
  font-family: 'Bebas Neue', var(--font-display);
  font-size: clamp(3rem, 8vw, 6rem);
  font-weight: 400;
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: .02em;
  margin: .5rem 0 .75rem;
}

.catalog-toolbar {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.75rem;
  flex-wrap: wrap;
}
.catalog-toolbar .search-wrap { flex: 1; min-width: 220px; max-width: 380px; }
.sort-select {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  color: var(--t1);
  padding: .75rem 1.25rem;
  font-size: .85rem;
  outline: none;
  cursor: pointer;
  transition: border-color var(--transition);
  font-family: inherit;
}
.sort-select:focus { border-color: var(--border-light); }
.results-count {
  color: var(--t2);
  font-size: .83rem;
  margin-left: auto;
  white-space: nowrap;
}

.filter-bar { margin-bottom: 2rem; }

.empty-state {
  text-align: center;
  padding: 5rem 0;
  color: var(--t2);
  grid-column: 1 / -1;
}
.empty-state .icon { font-size: 3rem; margin-bottom: 1rem; opacity: .4; }

#productGrid { transition: opacity .18s ease; }
#productGrid.loading { opacity: .3; pointer-events: none; }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar" id="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="nav-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span>DSC</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="catalogo.html" style="color:var(--t1)">Catálogo</a></li>
      <li><a href="catalogo.html?cat=Nutrici%C3%B3n">Nutrición</a></li>
      <li><a href="catalogo.html?cat=Electr%C3%B3nica">Electrónica</a></li>
      <li><a href="catalogo.html?cat=Llantas">Llantas</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn btn-wa btn-sm" onclick="openWhatsAppGeneral()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        Asesoría
      </button>
      <a href="checkout.html" class="cart-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-count" style="display:none">0</span>
      </a>
      <div class="nav-burger" id="navBurger"><span></span><span></span><span></span></div>
    </div>
  </div>
</nav>

<!-- Page Header -->
<div class="page-header">
  <div class="page-header-bg"></div>
  <div class="page-header-orb"></div>
  <div class="container">
    <span class="label">Tienda</span>
    <h1 id="pageTitle">Catálogo</h1>
    <p class="section-sub">Equipamiento premium para ciclistas de alto rendimiento</p>
  </div>
</div>

<!-- Catalog -->
<section class="section-sm">
  <div class="container">

    <div class="catalog-toolbar">
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Buscar productos, marcas...">
      </div>
      <select id="sortSelect" class="sort-select">
        <option value="default">Ordenar por</option>
        <option value="price-asc">Precio: Menor a mayor</option>
        <option value="price-desc">Precio: Mayor a menor</option>
        <option value="name">Nombre A-Z</option>
        <option value="stock">Con stock primero</option>
      </select>
      <span class="results-count" id="resultsCount"></span>
    </div>

    <div class="filter-bar">
      <div class="filter-chips" id="filterChips"></div>
    </div>

    <div class="grid g4" id="productGrid"></div>

  </div>
</section>

<!-- Footer -->
<footer style="background:var(--surface);border-top:1px solid var(--border);padding:2rem 0">
  <div class="container" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem">
    <a href="index.html" class="nav-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent)"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span>DSC</span>
    </a>
    <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
      <button class="btn btn-wa btn-sm" onclick="openWhatsAppGeneral()">Asesoría WhatsApp</button>
      <a href="privacidad.html" style="color:var(--t3);font-size:.82rem">Privacidad</a>
    </div>
  </div>
</footer>

<div id="toast" class="toast toast-accent"></div>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script src="js/whatsapp.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

let activeCategory = 'all';
let activeSearch = '';
let activeSort = 'default';

function getFiltered() {
  let list = activeSearch ? searchProducts(activeSearch) : [...PRODUCTS];
  if (activeCategory !== 'all') list = list.filter(p => p.category === activeCategory);
  switch (activeSort) {
    case 'price-asc':  list.sort((a,b) => a.price - b.price); break;
    case 'price-desc': list.sort((a,b) => b.price - a.price); break;
    case 'name':       list.sort((a,b) => a.name.localeCompare(b.name)); break;
    case 'stock':      list.sort((a,b) => b.stock - a.stock); break;
  }
  return list;
}

function renderGrid(animate = false) {
  const list = getFiltered();
  const grid = document.getElementById('productGrid');
  document.getElementById('resultsCount').textContent =
    `${list.length} producto${list.length !== 1 ? 's' : ''}`;

  if (!list.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="icon">🔍</div>
      <p>No se encontraron productos</p>
      <button class="btn btn-ghost btn-sm" style="margin-top:1rem" onclick="resetFilters()">Limpiar filtros</button>
    </div>`;
    return;
  }

  grid.innerHTML = list.map(p => renderProductCard(p, false)).join('');

  if (animate) {
    gsap.from('#productGrid .product-card', {
      opacity: 0, y: 30, stagger: .04, duration: .5, ease: 'power2.out'
    });
  }
}

function resetFilters() {
  activeCategory = 'all';
  activeSearch = '';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.cat === 'all'));
  renderGrid(true);
}

function buildChips() {
  const cats = ['all', ...getCategories()];
  document.getElementById('filterChips').innerHTML = cats.map(cat => {
    const label = cat === 'all' ? 'Todos' : cat;
    return `<button class="chip${cat === activeCategory ? ' active' : ''}" data-cat="${cat}" onclick="setCategory('${cat}')">${label}</button>`;
  }).join('');
}

function setCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.cat === cat));
  renderGrid(true);
}

// URL param: ?cat=Llantas
const urlCat = new URLSearchParams(location.search).get('cat');
if (urlCat) {
  activeCategory = urlCat;
  const title = document.getElementById('pageTitle');
  if (title) title.textContent = urlCat;
}

buildChips();
renderGrid(true);

document.getElementById('searchInput').addEventListener('input', e => {
  activeSearch = e.target.value.trim();
  renderGrid(false);
});
document.getElementById('sortSelect').addEventListener('change', e => {
  activeSort = e.target.value;
  renderGrid(true);
});

// Header entrance
gsap.from('.page-header h1', { opacity: 0, y: 40, duration: .8, ease: 'power3.out', delay: .2 });
gsap.from('.page-header .section-sub', { opacity: 0, y: 20, duration: .6, ease: 'power2.out', delay: .4 });
</script>
</body>
</html>
